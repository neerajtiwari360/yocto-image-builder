# Linux-only SD boot for K26 starter SOM + KV260 carrier, revisions A and B.
# Uses existing QSPI firmware; no XSCT, Vivado, new FSBL or QSPI update is built.
DEFAULTTUNE = "cortexa53"
require conf/machine/zynqmp-generic.conf
# Only standard user-mode emulation is needed for target package build helpers.
# Do not inherit the large Xilinx full-system emulator source dependency.
PREFERRED_PROVIDER_qemu = "qemu"
PREFERRED_PROVIDER_qemu-native = "qemu-native"
PREFERRED_PROVIDER_qemu-system-native = "qemu-system-native"
PREFERRED_PROVIDER_nativesdk-qemu = "nativesdk-qemu"
FPGA_MNGR_RECONFIG_ENABLE = "1"
SERIAL_CONSOLES = "115200;ttyPS1"
KERNEL_DEVICETREE = " \
    xilinx/zynqmp-smk-k26-revA-sck-kv-g-revA.dtb \
    xilinx/zynqmp-smk-k26-revA-sck-kv-g-revB.dtb \
"
KERNEL_DTC_FLAGS += "-@"
KERNEL_DTBVENDORED = "0"
MACHINE_FEATURES = "serial rtc ext2 vfat usbhost"
EXTRA_IMAGEDEPENDS = ""
INITRAMFS_IMAGE = ""
IMAGE_CLASSES:remove = "image-types-xilinx-qemu"
WKS_FILE = "kv260-hcsr04.wks"
# The vendor layer sets WKS_FILES independently; override its search list too.
WKS_FILES = "${WKS_FILE}"
# WIC creates FAT and ext4 partitions; both filesystem toolsets are required.
WKS_FILE_DEPENDS = "dosfstools-native mtools-native e2fsprogs-native virtual/kernel kv260-boot-script"
IMAGE_BOOT_FILES = " \
    Image \
    zynqmp-smk-k26-revA-sck-kv-g-revA.dtb;kv260-revA.dtb \
    zynqmp-smk-k26-revA-sck-kv-g-revB.dtb;kv260-revB.dtb \
    kv260-boot.scr;boot.scr \
"
