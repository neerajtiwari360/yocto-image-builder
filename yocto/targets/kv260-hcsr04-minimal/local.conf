require /project/yocto/config/common.conf
MACHINE = "kv260-hcsr04"
DISTRO = "poky"
# Lightweight on-board package management for optional, matching offline feeds.
PACKAGE_CLASSES = "package_ipk"
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 2"
IMAGE_FSTYPES:kv260-hcsr04 = "wic.bz2 wic.bmap"
# Size from installed contents, without a minimum or development-space reserve.
# Retain Yocto's normal filesystem overhead allowance for metadata/creation.
IMAGE_ROOTFS_SIZE = "0"
IMAGE_ROOTFS_EXTRA_SPACE = "0"
# UART-only local bench image.
EXTRA_IMAGE_FEATURES = "debug-tweaks"
IMAGE_LINGUAS = ""
