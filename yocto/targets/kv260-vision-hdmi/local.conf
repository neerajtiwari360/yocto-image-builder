require /project/yocto/targets/kv260-vision-minimal/local.conf
INIT_MANAGER = "systemd"
PACKAGECONFIG:append:pn-kv260-yunet = " hdmi"
IMAGE_INSTALL:append = " kv260-yunet-hdmi"
YUNET_HDMI_IMAGE = "1"
YUNET_HDMI_AUTOSTART = "1"
# Camera-only preview starts at boot; ML remains manually controlled and offline.
PACKAGECONFIG:remove:pn-systemd = "networkd resolved timesyncd importd machined myhostname nss nss-mymachines nss-resolve hostnamed localed timedated portabled homed userdb"
