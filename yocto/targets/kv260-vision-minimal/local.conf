require /project/yocto/config/common.conf
MACHINE = "kv260-vision"
DISTRO = "poky"
PACKAGE_CLASSES = "package_ipk"
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 2"
IMAGE_FSTYPES = "wic.bz2 wic.bmap"
IMAGE_FSTYPES:kv260-vision = "wic.bz2 wic.bmap"
IMAGE_ROOTFS_SIZE = "0"
# Deliberate writable reserve for later xmodel/code deployment and logs.
IMAGE_ROOTFS_EXTRA_SPACE = "32768"
EXTRA_IMAGE_FEATURES = "debug-tweaks"
IMAGE_LINGUAS = ""
NO_RECOMMENDATIONS = "1"
DISTRO_FEATURES:remove = "x11 wayland opengl vulkan bluetooth wifi nfc pulseaudio nfs zeroconf 3g"
PREFERRED_VERSION_linux-xlnx = "6.6.40%"
PREFERRED_VERSION_xrt = "202420.2.18.0"
PREFERRED_VERSION_zocl = "202420.2.18.0"
PREFERRED_PROVIDER_virtual/opencl-icd = "ocl-icd"
# Remove tests/demos enabled unconditionally by upstream vitisai.inc.
PACKAGECONFIG:remove:pn-vart = "test"
PACKAGECONFIG:remove:pn-xir = "test"
PACKAGECONFIG:remove:pn-target-factory = "test"
PACKAGECONFIG:remove:pn-unilog = "test"
PACKAGECONFIG:pn-xrt = ""

# Avoid HTTP/2 transport failures during the large pinned kernel fetch.
FETCHCMD_git:pn-linux-xlnx = "git -c gc.autoDetach=false -c core.pager=cat -c safe.bareRepository=all -c http.version=HTTP/1.1"

# Apply the same TLS-preserving transport workaround to XRT submodules.
FETCHCMD_git:pn-xrt = "git -c gc.autoDetach=false -c core.pager=cat -c safe.bareRepository=all -c http.version=HTTP/1.1"

# Native C/C++ deployment: no board-side Python bindings.
PACKAGECONFIG:remove:pn-vart = "python"
EXTRA_OECMAKE:append:pn-vart = " -DBUILD_PYTHON=OFF"

# Board runtime only: optional ptests pull in target GCC and development tools.
DISTRO_FEATURES:remove += "ptest"
IMAGE_FEATURES:remove = "ptest-pkgs tools-sdk"

# Use more CPU for the critical C++ runtimes within the 8 GiB Docker budget.
PARALLEL_MAKE:pn-xrt = "-j 4"
PARALLEL_MAKE:pn-vart = "-j 4"
