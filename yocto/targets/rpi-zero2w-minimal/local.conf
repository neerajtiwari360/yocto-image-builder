# 32-bit userspace for a small first image on the 512 MB Pi Zero 2 W.
MACHINE = "raspberrypi0-2w"
DISTRO = "poky"
require /project/yocto/config/common.conf
BB_NUMBER_THREADS = "4"
PARALLEL_MAKE = "-j 2"
IMAGE_FSTYPES = "wic.bz2 wic.bmap"
IMAGE_ROOTFS_SIZE = "16384"
EXTRA_IMAGE_FEATURES = "debug-tweaks"
ENABLE_UART = "1"
RPI_USE_U_BOOT = "0"

# Use the built-in legacy framebuffer instead of the modular VC4 graphics stack.
DISABLE_VC4GRAPHICS = "1"
GPU_MEM = "16"
